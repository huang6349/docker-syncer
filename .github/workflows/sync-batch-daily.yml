name: 01. 批量同步 (Batch Sync)

on:
  push:
    paths:
      - "images.txt"
  schedule:
    - cron: "0 0 1,20 * *"
  workflow_dispatch:
    inputs:
      priority_new:
        description: "优先新增 (新增优先同步)"
        required: false
        type: boolean
        default: true
      force_sync:
        description: "强制同步 (跳过摘要比对)"
        required: false
        type: boolean
        default: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
  GHCR_REGISTRY: ghcr.io
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
  # 映射 Secret 到 Env 以供 if 判断
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  batch-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # 🔥 关键修复：必须先 Checkout 代码，才能读取 config.env
      - name: Checkout Code
        uses: actions/checkout@v4
      # 🔧 Skopeo 依赖检查
      - name: 检查和安装 Skopeo
        run: |
          if ! command -v skopeo &> /dev/null; then
            echo "Skopeo not found, installing..."
            sudo apt-get update && sudo apt-get install -y skopeo
          else
            echo "✅ Skopeo 已安装: $(skopeo --version)"
          fi
      - name: 读取配置 & 检查 Secrets
        id: config
        env:
          # 🔒 安全修复：先将 Secrets 映射为环境变量，避免直接注入脚本
          ALI_USER: ${{ secrets.ALIYUN_USERNAME }}
          ALI_PASS: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          # 读取 config.env (如果存在)
          if [ -f "config.env" ]; then
             source config.env
             echo "CLEAN_DISK_SPACE=${CLEAN_DISK_SPACE}" >> $GITHUB_OUTPUT
             echo "SYNC_MODE=${SYNC_MODE}" >> $GITHUB_ENV
          else
             echo "CLEAN_DISK_SPACE=true" >> $GITHUB_OUTPUT
             echo "SYNC_MODE=none" >> $GITHUB_ENV
          fi

          if [ -z "$ALI_USER" ] || [ -z "$ALI_PASS" ]; then
            echo "❌ 错误: 未配置 ALIYUN_USERNAME 或 ALIYUN_PASSWORD Secrets。"
            exit 1
          fi

      - name: 🗑️ 清理磁盘空间
        uses: easimon/maximize-build-space@master
        if: steps.config.outputs.CLEAN_DISK_SPACE == 'true'
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          build-mount-path: "/var/lib/docker/"

      - name: 重启 Docker 服务
        run: sudo service docker restart

      - name: 登录阿里云 ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: 登录 GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 DockerHub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: 🔍 检测新增镜像
        id: detect-new
        env:
          PRIORITY_NEW: ${{ inputs.priority_new }}
        run: |
          # 获取新增的行（相对于上一版本）
          if [ "$PRIORITY_NEW" == "true" ] && git rev-parse HEAD~1 >/dev/null 2>&1; then
            # 获取新增的非注释、非空行
            NEW_IMAGES=$(git diff HEAD~1 -- images.txt | grep '^+' | grep -v '^+++' | grep -v '^#' | grep -v '^$' | sed 's/^+//' | xargs)
            echo "new_images=$NEW_IMAGES" >> $GITHUB_OUTPUT
            echo "检测到新增镜像: $NEW_IMAGES"
          else
            echo "new_images=" >> $GITHUB_OUTPUT
          fi

      - name: 📦 批量处理镜像
        run: |
          # 加载智能命名函数库
          source .github/scripts/naming-functions.sh

          # 定义重试函数
          function retry {
            local n=1
            local max=3
            local delay=5
            while true; do
              "$@" && break || {
                if [[ $n -lt $max ]]; then
                  ((n++))
                  echo "⚠️ 命令失败，尝试第 $n/$max 次重试..." >&2
                  sleep $delay;
                else
                  echo "❌ 命令在 $max 次尝试后失败。" >&2
                  return 1
                fi
              }
            done
          }

          # 快速检查目标是否存在（避免不必要的 skopeo inspect）
          function target_exists {
            local target="$1"
            local flags="$2"
            skopeo inspect $flags "docker://$target" >/dev/null 2>&1
          }

          if [ ! -s "images.txt" ]; then
            echo "⚠️ images.txt 不存在或为空。"
            exit 0
          fi

          # 读取新增镜像列表
          PRIORITY_NEW="${{ inputs.priority_new }}"
          NEW_IMAGES="${{ steps.detect-new.outputs.new_images }}"
          IFS=' ' read -ra NEW_ARRAY <<< "$NEW_IMAGES"

          # 创建临时文件存储需优先处理的镜像
          PRIORITY_FILE=$(mktemp)
          NORMAL_FILE=$(mktemp)

          # 分离新增镜像和已有镜像
          while IFS= read -r line || [ -n "$line" ]; do
            SKIP=false
            if [ "$PRIORITY_NEW" == "true" ]; then
              for new_img in "${NEW_ARRAY[@]}"; do
                # 去除参数后比较镜像名
                clean_new=$(echo "$new_img" | sed -E 's/--[a-z-]+=[^ ]+//g' | sed -E 's/--[a-z-]+ +[^ ]+//g' | sed -E 's/--[a-z-]+//g' | xargs)
                clean_line=$(echo "$line" | sed -E 's/--[a-z-]+=[^ ]+//g' | sed -E 's/--[a-z-]+ +[^ ]+//g' | sed -E 's/--[a-z-]+//g' | xargs)
                if [ "$clean_new" == "$clean_line" ]; then
                  echo "$line" >> "$PRIORITY_FILE"
                  SKIP=true
                  break
                fi
              done
            fi
            if [ "$SKIP" != "true" ]; then
              echo "$line" >> "$NORMAL_FILE"
            fi
          done < images.txt

          # 处理函数
          process_image() {
            local line="$1"
            local SKOPEO_OS="linux"
            local SKOPEO_ARCH="amd64"
            local PLATFORM_VAL=""
            local PLATFORM_ARG=""

            # 去除首尾空白
            line=$(echo "$line" | xargs)
            # 跳过空行和注释
            [[ -z "$line" || "$line" =~ ^# ]] && return

            echo "----------------------------------------"
            echo "🔄 处理指令: $line"

            # 提取 platform 参数值
            if [[ "$line" =~ --platform[=\ ]([^ ]+) ]]; then
                 PLATFORM_VAL="${BASH_REMATCH[1]}"
                 PLATFORM_ARG="--platform $PLATFORM_VAL"
                 echo "⚙️  指定架构: $PLATFORM_VAL"

                 if [[ "$PLATFORM_VAL" == *"/"* ]]; then
                    SKOPEO_OS=$(echo "$PLATFORM_VAL" | cut -d'/' -f1)
                    SKOPEO_ARCH=$(echo "$PLATFORM_VAL" | cut -d'/' -f2)
                 else
                    SKOPEO_ARCH="$PLATFORM_VAL"
                 fi
            fi

            SKOPEO_FLAGS="--override-os $SKOPEO_OS --override-arch $SKOPEO_ARCH"

            # 提取镜像名
            TEMP_LINE="$line"
            TEMP_LINE=$(echo "$TEMP_LINE" | sed -E 's/--[a-z-]+=[^ ]+//g')
            TEMP_LINE=$(echo "$TEMP_LINE" | sed -E 's/--[a-z-]+ +[^ ]+//g')
            TEMP_LINE=$(echo "$TEMP_LINE" | sed -E 's/--[a-z-]+//g')
            local SRC_IMAGE=$(echo "$TEMP_LINE" | xargs)

            # 智能命名处理
            local TARGET_TAG=$(calculate_target_tag "$SRC_IMAGE" "$PLATFORM_VAL")
            local MODE="${SYNC_MODE:-none}"

            if [ "$MODE" == "none" ]; then
                echo "🛑 同步模式为 none，跳过。"
                return
            fi

            local ALI_TARGET="$ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/$TARGET_TAG"
            local OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            local TAG_LOWER=$(echo "$TARGET_TAG" | tr '[:upper:]' '[:lower:]')
            local GHCR_TARGET="$GHCR_REGISTRY/$OWNER_LOWER/$TAG_LOWER"

            local FORCE="${{ inputs.force_sync }}"
            local PUSH_ALI=false
            local PUSH_GHCR=false
            local NEED_PULL=false
            local CHECK_ALI=false
            local CHECK_GHCR=false

            case "$MODE" in
                aliyun) CHECK_ALI=true ;;
                ghcr) CHECK_GHCR=true ;;
                double) CHECK_ALI=true; CHECK_GHCR=true ;;
                *) echo "⚠️ 未知模式 $MODE"; return ;;
            esac

            # 快速跳过：检查目标是否存在
            if [ "$FORCE" != "true" ]; then
               local SKIP_ALL=false

               if [ "$CHECK_ALI" == "true" ]; then
                 if ! target_exists "$ALI_TARGET" "$SKOPEO_FLAGS"; then
                   echo "🆕 [Aliyun] 目标不存在，需同步"
                   PUSH_ALI=true
                 else
                   echo "✅ [Aliyun] 已存在"
                 fi
               fi

               if [ "$CHECK_GHCR" == "true" ]; then
                 if ! target_exists "$GHCR_TARGET" "$SKOPEO_FLAGS"; then
                   echo "🆕 [GHCR] 目标不存在，需同步"
                   PUSH_GHCR=true
                 else
                   echo "✅ [GHCR] 已存在"
                 fi
               fi

               # 如果目标都存在，进行摘要比对确认是否真的需要更新
               if [ "$PUSH_ALI" != "true" ] && [ "$PUSH_GHCR" != "true" ]; then
                 echo "🔍 所有目标已存在，进行摘要比对..."
                 local SRC_INFO=$(retry skopeo inspect $SKOPEO_FLAGS "docker://$SRC_IMAGE" --format='{{.Digest}}|{{.Created}}' 2>/dev/null || echo "")
                 local SRC_DIGEST=$(echo "$SRC_INFO" | cut -d'|' -f1)
                 local SRC_CREATED=$(echo "$SRC_INFO" | cut -d'|' -f2)

                 if [ -z "$SRC_DIGEST" ]; then
                     echo "⚠️ 无法获取源镜像信息，跳过。"
                     return
                 fi

                 if [ "$CHECK_ALI" == "true" ]; then
                   local ALI_INFO=$(retry skopeo inspect $SKOPEO_FLAGS "docker://$ALI_TARGET" --format='{{.Digest}}|{{.Created}}' 2>/dev/null || echo "")
                   local ALI_DIGEST=$(echo "$ALI_INFO" | cut -d'|' -f1)
                   local ALI_CREATED=$(echo "$ALI_INFO" | cut -d'|' -f2)

                   if [ "$SRC_DIGEST" != "$ALI_DIGEST" ] && ! ([ -n "$ALI_DIGEST" ] && [ "$SRC_CREATED" == "$ALI_CREATED" ]); then
                     echo "🚀 [Aliyun] 需更新"
                     PUSH_ALI=true
                   fi
                 fi

                 if [ "$CHECK_GHCR" == "true" ]; then
                   local GHCR_INFO=$(retry skopeo inspect $SKOPEO_FLAGS "docker://$GHCR_TARGET" --format='{{.Digest}}|{{.Created}}' 2>/dev/null || echo "")
                   local GHCR_DIGEST=$(echo "$GHCR_INFO" | cut -d'|' -f1)
                   local GHCR_CREATED=$(echo "$GHCR_INFO" | cut -d'|' -f2)

                   if [ "$SRC_DIGEST" != "$GHCR_DIGEST" ] && ! ([ -n "$GHCR_DIGEST" ] && [ "$SRC_CREATED" == "$GHCR_CREATED" ]); then
                     echo "🚀 [GHCR] 需更新"
                     PUSH_GHCR=true
                   fi
                 fi
               fi
            else
               echo "⚠️ 强制模式，跳过比对。"
               [ "$CHECK_ALI" == "true" ] && PUSH_ALI=true
               [ "$CHECK_GHCR" == "true" ] && PUSH_GHCR=true
            fi

            if [ "$PUSH_ALI" == "true" ] || [ "$PUSH_GHCR" == "true" ]; then
                NEED_PULL=true
            fi

            # 执行同步
            if [ "$NEED_PULL" == "true" ]; then
               echo "📥 拉取 $SRC_IMAGE ..."
               retry docker pull "$SRC_IMAGE" $PLATFORM_ARG

               if [ "$PUSH_ALI" == "true" ]; then
                   echo "🏷️ -> 阿里云 $ALI_TARGET"
                   docker tag "$SRC_IMAGE" "$ALI_TARGET"
                   retry docker push "$ALI_TARGET"
                   docker rmi "$ALI_TARGET" >/dev/null 2>&1 || true
               fi

               if [ "$PUSH_GHCR" == "true" ]; then
                   echo "🏷️ -> GHCR $GHCR_TARGET"
                   docker tag "$SRC_IMAGE" "$GHCR_TARGET"
                   retry docker push "$GHCR_TARGET"
                   docker rmi "$GHCR_TARGET" >/dev/null 2>&1 || true
               fi

               echo "🧹 清理源镜像..."
               docker rmi "$SRC_IMAGE" >/dev/null 2>&1 || true
            else
               echo "💤 无需更新。"
            fi

            echo "磁盘空间:"
            df -h | grep "/var/lib/docker" | awk '{print $4 " available"}' || true
          }

          # 优先处理新增镜像
          if [ -s "$PRIORITY_FILE" ]; then
            echo ""
            echo "🚀 ================== 优先处理新增镜像 =================="
            while IFS= read -r line || [ -n "$line" ]; do
              process_image "$line"
            done < "$PRIORITY_FILE"
          fi

          # 处理剩余镜像
          if [ -s "$NORMAL_FILE" ]; then
            echo ""
            echo "📦 ================== 处理已有镜像 =================="
            while IFS= read -r line || [ -n "$line" ]; do
              process_image "$line"
            done < "$NORMAL_FILE"
          fi

          # 清理临时文件
          rm -f "$PRIORITY_FILE" "$NORMAL_FILE"

      - name: 更新 README Badge
        run: |
          # 获取当前 UTC+8 时间
          DATE=$(TZ='Asia/Shanghai' date +'%Y--%m--%d %H:%M:%S')
          # URL Encode (space -> %20)
          ENC_DATE=${DATE// /%20}

          # 构造新的 badge 链接
          NEW_BADGE="https://img.shields.io/badge/last%20sync-$ENC_DATE-green"

          # 替换 README 中的 badge
          # 匹配模式: ![Last Sync](https://img.shields.io/badge/.*)
          sed -i "s|!\[Last Sync\](.*)|![Last Sync]($NEW_BADGE)|g" README.md

          # 提交更改
          if [[ -n $(git status -s) ]]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git commit -am "docs: update last sync badge [skip ci]"
            
            # 🔥 防止并发冲突：先拉取最新代码
            git pull --rebase origin main || {
              echo "⚠️ Rebase 失败，尝试使用 merge 策略"
              git pull --no-rebase origin main
            }
            
            # 🔥 防止 Detached HEAD：明确推送到 main 分支
            git push origin HEAD:main
          else
             echo "没有变更需要提交。"
          fi

      - name: 发送 Webhook 通知
        if: always()
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "未配置 WEBHOOK_URL，跳过通知。"
            exit 0
          fi

          JOB_STATUS="${{ job.status }}"
          REPO_NAME="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$JOB_STATUS" == "success" ]; then
             COLOR="info"
             TITLE="✅ 批量同步成功"
          else
             COLOR="warning"
             TITLE="❌ 批量同步失败"
          fi

          # 构造简单 JSON (适配常见的钉钉/飞书/Discord/Slack)
          # 这里采用通用 JSON 结构，可视需要调整

          PAYLOAD=$(cat <<EOF
          {
            "msg_type": "text",
            "content": {
              "text": "$TITLE\n仓库: $REPO_NAME\n状态: $JOB_STATUS\n链接: $RUN_URL"
            }
          }
          EOF
          )

          echo "发送通知..."
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL" || echo "发送失败"
