name: 02. 双重同步 (Aliyun + GHCR)

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "原镜像名称 (例如: mysql:8.0)"
        required: true
        default: "nginx:alpine"
      target_name:
        description: "保存名称 (可选，留空则自动处理)"
        required: false
      platform:
        description: "指定架构 (例如: linux/arm64，留空默认 amd64)"
        required: false
        default: ""
      force_sync:
        description: "强制同步 (跳过摘要比对)"
        type: boolean
        required: false
        default: false
      clean_disk:
        description: "清理磁盘空间 (减少空间不足风险，但耗时增加)"
        type: boolean
        required: false
        default: false

env:
  # 阿里云配置
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
  # GHCR 配置
  GHCR_REGISTRY: ghcr.io
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
  # 映射 Secret 到 Env 以供 if 判断
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  double-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 必须赋予写 GHCR 的权限

    steps:
      # 🔥 关键修复：先 Checkout 代码，才能读取 config.env
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 读取 config.env 配置
        id: config
        run: |
          if [ -f "config.env" ]; then
            echo "读取 config.env 配置..."
            source config.env
            echo "CLEAN_DISK_SPACE=$CLEAN_DISK_SPACE" >> $GITHUB_ENV
            echo "✅ 配置加载成功 (CLEAN_DISK_SPACE=$CLEAN_DISK_SPACE)"
          else
            echo "⚠️ 未找到 config.env，使用默认配置"
            echo "CLEAN_DISK_SPACE=${{ inputs.clean_disk }}" >> $GITHUB_ENV
          fi

      # 🔧 Skopeo 依赖检查
      - name: 检查和安装 Skopeo
        run: |
          if ! command -v skopeo &> /dev/null; then
            echo "Skopeo not found, installing..."
            sudo apt-get update && sudo apt-get install -y skopeo
          else
            echo "✅ Skopeo 已安装: $(skopeo --version)"
          fi

      # 1. 极致空间清理
      - name: 🗑️ 清理磁盘空间
        uses: easimon/maximize-build-space@master
        if: env.CLEAN_DISK_SPACE == 'true'
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          build-mount-path: "/var/lib/docker/"

      - name: 重启 Docker
        run: sudo service docker restart

      - name: 检查 Secrets
        env:
          # 🔒 安全修复：先将 Secrets 映射为环境变量
          ALI_USER: ${{ secrets.ALIYUN_USERNAME }}
          ALI_PASS: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          if [ -z "$ALI_USER" ] || [ -z "$ALI_PASS" ]; then
            echo "❌ 错误: 未配置 ALIYUN_USERNAME 或 ALIYUN_PASSWORD Secrets。"
            echo "请在 Settings -> Secrets and variables -> Actions 中配置。"
            exit 1
          fi

      # 2. 登录流程 (3方登录)
      - name: 登录 DockerHub (避免限流)
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: 登录阿里云
        uses: docker/login-action@v2
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: 登录 GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 核心逻辑 (双向智能同步)
      - name: 执行双重同步
        env:
          INPUT_IMAGE: ${{ inputs.image_name }}
          INPUT_TARGET: ${{ inputs.target_name }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_FORCE: ${{ inputs.force_sync }}
        run: |
          # 加载智能命名函数库
          source .github/scripts/naming-functions.sh

          # Define retry function
          function retry {
            local n=1
            local max=3
            local delay=5
            while true; do
              "$@" && break || {
                if [[ $n -lt $max ]]; then
                  ((n++))
                  echo "⚠️ Command failed. Attempt $n/$max:" >&2
                  sleep $delay;
                else
                  echo "❌ The command has failed after $max attempts." >&2
                  return 1
                fi
              }
            done
          }

          # 快速检查目标是否存在
          function target_exists {
            local target="$1"
            local flags="$2"
            skopeo inspect $flags "docker://$target" >/dev/null 2>&1
          }

          # --- A. 变量准备 ---
          SRC_IMAGE="$INPUT_IMAGE"
          PLATFORM_ARG=""
          # 默认架构参数供 Skopeo 使用
          SKOPEO_OS="linux"
          SKOPEO_ARCH="amd64"

          if [ -n "$INPUT_PLATFORM" ]; then
            PLATFORM_ARG="--platform $INPUT_PLATFORM"
            echo "⚙️ 指定架构: $INPUT_PLATFORM"

            # 解析 platform (例如 linux/arm64)
            if [[ "$INPUT_PLATFORM" == *"/"* ]]; then
               SKOPEO_OS=$(echo "$INPUT_PLATFORM" | awk -F'/' '{print $1}')
               SKOPEO_ARCH=$(echo "$INPUT_PLATFORM" | awk -F'/' '{print $2}')
            else
               SKOPEO_ARCH="$INPUT_PLATFORM"
            fi
          fi

          # 构造 Skopeo 参数：强制检查特定架构的摘要，避免 Manifest List 导致的误判
          SKOPEO_FLAGS="--override-os $SKOPEO_OS --override-arch $SKOPEO_ARCH"
          echo "🔍 Skopeo 检查模式: OS=$SKOPEO_OS, ARCH=$SKOPEO_ARCH"

          # --- B. 智能命名计算 ---
          if [ -n "$INPUT_TARGET" ]; then
            # 用户指定目标名称：只做规范化处理
            BASE_TAG=$(echo "$INPUT_TARGET" | tr '[:upper:]' '[:lower:]')
            BASE_TAG="${BASE_TAG//_/-}"
            # 追加架构后缀
            if [ -n "$INPUT_PLATFORM" ]; then
                ARCH_SUFFIX=$(echo "$INPUT_PLATFORM" | sed 's/.*\///')
                BASE_TAG="${BASE_TAG%-${ARCH_SUFFIX}}"
                BASE_TAG="${BASE_TAG}-${ARCH_SUFFIX}"
            fi
          else
            # 自动计算目标名称
            BASE_TAG=$(calculate_target_tag "$SRC_IMAGE" "$INPUT_PLATFORM")
          fi

          # 构造两个目标地址
          # 1. 阿里云地址
          ALI_TARGET="$ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/$BASE_TAG"

          # 2. GHCR 地址 (强制小写)
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG_LOWER=$(echo "$BASE_TAG" | tr '[:upper:]' '[:lower:]')
          GHCR_TARGET="$GHCR_REGISTRY/$OWNER_LOWER/$TAG_LOWER"

          echo "🎯 阿里云目标: $ALI_TARGET"
          echo "🎯 GHCR 目标: $GHCR_TARGET"

          # --- C. 智能摘要比对 (三方博弈) ---
          PUSH_ALI=true
          PUSH_GHCR=true

          if [ "$INPUT_FORCE" == "false" ]; then
             echo "🔍 开始比对 Digest & Created..."

             # 先快速检查目标是否存在
             if ! target_exists "$ALI_TARGET" "$SKOPEO_FLAGS"; then
               echo "🆕 [Aliyun] 目标不存在，需同步"
               PUSH_ALI=true
             else
               echo "✅ [Aliyun] 目标已存在，获取摘要..."
             fi

             if ! target_exists "$GHCR_TARGET" "$SKOPEO_FLAGS"; then
               echo "🆕 [GHCR] 目标不存在，需同步"
               PUSH_GHCR=true
             else
               echo "✅ [GHCR] 目标已存在，获取摘要..."
             fi

             # 如果目标都存在，获取摘要进行比对
             if [ "$PUSH_ALI" == "true" ] || [ "$PUSH_GHCR" == "true" ]; then
               # 获取源信息
               SRC_INFO=$(retry skopeo inspect $SKOPEO_FLAGS "docker://$SRC_IMAGE" --format='{{.Digest}}|{{.Created}}' 2>/dev/null || echo "")
               SRC_DIGEST=$(echo "$SRC_INFO" | cut -d'|' -f1)
               SRC_CREATED=$(echo "$SRC_INFO" | cut -d'|' -f2)

               if [ -z "$SRC_DIGEST" ]; then
                   echo "⚠️ 无法获取源摘要，全部跳过。"
                   PUSH_ALI=false
                   PUSH_GHCR=false
               else
                 # 检查阿里云
                 if [ "$PUSH_ALI" == "true" ]; then
                   ALI_INFO=$(retry skopeo inspect $SKOPEO_FLAGS "docker://$ALI_TARGET" --format='{{.Digest}}|{{.Created}}' 2>/dev/null || echo "")
                   ALI_DIGEST=$(echo "$ALI_INFO" | cut -d'|' -f1)
                   ALI_CREATED=$(echo "$ALI_INFO" | cut -d'|' -f2)

                   if [ "$SRC_DIGEST" == "$ALI_DIGEST" ]; then
                      echo "✅ [Aliyun] 摘要一致，跳过。"
                      PUSH_ALI=false
                   elif [ -n "$ALI_DIGEST" ] && [ "$SRC_CREATED" == "$ALI_CREATED" ]; then
                      echo "⚠️ [Aliyun] 摘要不同但创建时间一致，跳过。"
                      PUSH_ALI=false
                   fi
                 fi

                 # 检查 GHCR
                 if [ "$PUSH_GHCR" == "true" ]; then
                   GHCR_INFO=$(retry skopeo inspect $SKOPEO_FLAGS "docker://$GHCR_TARGET" --format='{{.Digest}}|{{.Created}}' 2>/dev/null || echo "")
                   GHCR_DIGEST=$(echo "$GHCR_INFO" | cut -d'|' -f1)
                   GHCR_CREATED=$(echo "$GHCR_INFO" | cut -d'|' -f2)

                   if [ "$SRC_DIGEST" == "$GHCR_DIGEST" ]; then
                      echo "✅ [GHCR] 摘要一致，跳过。"
                      PUSH_GHCR=false
                   elif [ -n "$GHCR_DIGEST" ] && [ "$SRC_CREATED" == "$GHCR_CREATED" ]; then
                      echo "⚠️ [GHCR] 摘要不同但创建时间一致，跳过。"
                      PUSH_GHCR=false
                   fi
                 fi
               fi
             else
               echo "💤 所有目标已存在且无需更新"
             fi
          else
             echo "⚠️ 强制模式，跳过比对。"
          fi

          # --- D. 执行同步 ---
          # 只要有一方需要推，就需要拉取
          if [ "$PUSH_ALI" == "true" ] || [ "$PUSH_GHCR" == "true" ]; then
             echo "📥 正在拉取源镜像: $SRC_IMAGE"
             retry docker pull "$SRC_IMAGE" $PLATFORM_ARG

             # 1. 推送阿里云
             if [ "$PUSH_ALI" == "true" ]; then
                echo "🚀 推送阿里云..."
                docker tag "$SRC_IMAGE" "$ALI_TARGET"
                retry docker push "$ALI_TARGET"
                docker rmi "$ALI_TARGET"
             fi

             # 2. 推送 GHCR
             if [ "$PUSH_GHCR" == "true" ]; then
                echo "🚀 推送 GHCR..."
                docker tag "$SRC_IMAGE" "$GHCR_TARGET"
                retry docker push "$GHCR_TARGET"
                docker rmi "$GHCR_TARGET"
             fi
             
             # 清理源镜像
             docker rmi "$SRC_IMAGE"
             echo "✅ 双重同步完成！"
          else
             echo "💤 所有目标都已是最新，无需操作。"
          fi

      - name: 发送 Webhook 通知
        if: always()
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "未配置 WEBHOOK_URL，跳过通知。"
            exit 0
          fi

          JOB_STATUS="${{ job.status }}"
          REPO_NAME="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$JOB_STATUS" == "success" ]; then
             TITLE="✅ 双重同步成功"
          else
             TITLE="❌ 双重同步失败"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "msg_type": "text",
            "content": {
              "text": "$TITLE\n仓库: $REPO_NAME\n状态: $JOB_STATUS\n链接: $RUN_URL"
            }
          }
          EOF
          )

          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL" || echo "发送失败"
